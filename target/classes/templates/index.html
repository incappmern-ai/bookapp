<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
</head>
<body>
	<h1>Incapp Book App</h1>
	<hr>
	<a href='/'>Home</a> &nbsp;&nbsp;&nbsp;&nbsp;
	<a href='login'>Login</a> &nbsp;&nbsp;&nbsp;&nbsp;
	<hr>
	<p th:if="${msg}" th:text="${msg}" style="background-color: yellow; padding:20px;"></p>
	<h2>Search by Book- Name</h2>
	<form action="SearchBook" method="post">
		<label>Name:</label>
		<input type="text" name="name" required />
		<br><br>
		<button>Submit</button>
	</form>
	<h2>Search by Book- AuthorName</h2>
	<form action="SearchBook2" method="post">
		<label>Author Name:</label>
		<input type="text" name="aname" required />
		<br><br>
		<button>Submit</button>
	</form>
	<h2>Search by Book- Price and AuthorName</h2>
	<form action="SearchBook3" method="post">
		<label>Price:</label>
		<input type="number" name="price" required />
		<label>Author Name:</label>
		<input type="text" name="aname" required />
		<br><br>
		<button>Submit</button>
	</form>
</body>
</html>
